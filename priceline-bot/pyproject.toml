[project]
name = "priceline-bot"
version = "0.1.0"
description = "OpenAI-compatible API in front of the Priceline Penny chat API, used as a Target LLM by llm-bias-pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "openai>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
